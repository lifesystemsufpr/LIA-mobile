<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIA Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#2962FF',
                        'primary-light': '#5C8DFF',
                        'primary-dark': '#091223',
                        secondary: '#5C8DFF',
                        accent: '#38B2AC',
                        success: '#22C55E',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        surface: '#FFFFFF',
                        background: '#F7F9FC',
                        'text-main': '#172033',
                        'text-muted': '#667085',
                        border: '#E4E7EC',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            height: 100dvh;
            background-color: #F7F9FC;
            position: relative;
            box-shadow: 0 0 40px rgba(13, 27, 61, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 80px;
        }

        .execution-mode .app-content {
            padding-bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: #091223;
            color: white;
        }

        .execution-mode .bottom-nav {
            display: none !important;
        }

        .login-mode .bottom-nav {
            display: none !important;
        }

        .login-mode .app-content {
            padding-bottom: 0;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scale-in {
            animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .pulse-ring {
            animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(41, 98, 255, 0.5);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(41, 98, 255, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(41, 98, 255, 0);
            }
        }

        .shimmer {
            background: linear-gradient(110deg, transparent 33%, rgba(255, 255, 255, 0.15) 50%, transparent 67%);
            background-size: 250% 100%;
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .countdown-pulse {
            animation: countPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes countPulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Glass morphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Smooth button press */
        .btn-press {
            transition: transform 0.1s ease;
        }

        .btn-press:active {
            transform: scale(0.97);
        }

        /* Gradient accent bar */
        .accent-bar {
            background: linear-gradient(90deg, #2962FF 0%, #5C8DFF 50%, #38B2AC 100%);
        }

        /* Step timeline connector */
        .step-line::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #E4E7EC;
        }
    </style>
</head>

<body class="bg-gray-200">

    <div id="app" class="mobile-container text-text-main">

        <!-- MAIN CONTENT -->
        <main id="main-view" class="app-content no-scrollbar p-5">
            <!-- Views injected here -->
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav"
            class="bottom-nav absolute bottom-0 left-0 w-full bg-white border-t border-border flex justify-between px-2 pb-2 pt-2 h-[72px] z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
            <button class="nav-btn flex-1 flex flex-col items-center justify-center text-primary-dark gap-1 relative"
                data-route="home">
                <div class="absolute -top-0.5 w-8 h-[3px] rounded-full bg-primary-dark transition-all nav-indicator">
                </div>
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Início</span>
            </button>
            <button
                class="nav-btn flex-1 flex flex-col items-center justify-center text-text-muted gap-1 relative hover:text-primary-dark transition-colors"
                data-route="history">
                <div class="absolute -top-0.5 w-8 h-[3px] rounded-full bg-transparent transition-all nav-indicator">
                </div>
                <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Avaliações</span>
            </button>
            <button
                class="nav-btn flex-1 flex flex-col items-center justify-center text-text-muted gap-1 relative hover:text-primary-dark transition-colors"
                data-route="participants">
                <div class="absolute -top-0.5 w-8 h-[3px] rounded-full bg-transparent transition-all nav-indicator">
                </div>
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Participantes</span>
            </button>

        </nav>

        <!-- MODAL RESUMO -->
        <div id="modal-summary"
            class="fixed inset-0 z-50 hidden flex-col items-center justify-end bg-black/50 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-auto max-w-[480px] mx-auto">
            <div class="bg-white w-full rounded-t-3xl p-6 shadow-2xl transform translate-y-full transition-transform duration-300"
                id="modal-summary-content">
                <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>

                <h2 class="text-xl font-extrabold text-primary-dark mb-5">Resumo</h2>

                <div class="bg-white rounded-2xl shadow-sm border border-border p-6 flex flex-col items-center mb-8">
                    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary to-primary-dark text-white flex items-center justify-center font-bold text-2xl mb-4 shadow-lg"
                        id="modal-ps-initials">MS</div>
                    <h3 class="text-2xl font-extrabold text-text-main mb-4" id="modal-ps-name">Manuela Silva</h3>

                    <div class="w-full space-y-1">
                        <div class="flex justify-between items-center py-3 border-b border-border">
                            <span class="text-text-muted text-xs font-bold uppercase tracking-wider">CPF</span>
                            <span class="font-bold text-text-main text-sm">123.456.789-00</span>
                        </div>
                        <div class="flex justify-between items-center py-3 border-b border-border">
                            <span class="text-text-muted text-xs font-bold uppercase tracking-wider">Nascimento</span>
                            <span class="font-bold text-text-main text-sm">15/03/1958 (<span id="modal-ps-age">68</span>
                                anos)</span>
                        </div>
                        <div class="flex justify-between items-center py-3">
                            <span class="text-text-muted text-xs font-bold uppercase tracking-wider">Última
                                Avaliação</span>
                            <span class="font-bold text-primary-dark text-sm">12/08/2025</span>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button
                        class="flex-1 bg-white text-text-muted border border-border font-bold py-4 rounded-xl btn-press"
                        onclick="app.closeSummaryModal()">
                        Cancelar
                    </button>
                    <button
                        class="flex-1 bg-primary text-white font-extrabold py-4 rounded-xl shadow-lg btn-press flex items-center justify-center gap-2"
                        onclick="app.confirmParticipantAndContinue()">
                        Continuar <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- MODAL CONFIRMAR ENVIO -->
        <div id="modal-send-data"
            class="fixed inset-0 z-50 hidden flex-col items-center justify-end bg-black/50 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-auto max-w-[480px] mx-auto">
            <div class="bg-white w-full rounded-t-3xl p-6 shadow-2xl transform translate-y-full transition-transform duration-300"
                id="modal-send-data-content">
                <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>

                <h2 class="text-xl font-extrabold text-primary-dark mb-5 text-center">Enviar Dados?</h2>
                
                <p class="text-text-muted text-center mb-8 font-medium">Deseja confirmar o envio dos dados desta avaliação?</p>

                <div class="flex gap-3">
                    <button
                        class="flex-1 bg-white text-text-muted border border-border font-bold py-4 rounded-xl btn-press"
                        onclick="app.closeSendDataModal()">
                        Cancelar
                    </button>
                    <button
                        class="flex-1 bg-primary text-white font-extrabold py-4 rounded-xl shadow-lg btn-press flex items-center justify-center gap-2"
                        onclick="app.confirmSendData()">
                        Enviar <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== TEMPLATES ==================== -->

    <!-- 0. LOGIN -->
    <template id="tpl-login">
        <div
            class="fade-in flex flex-col h-full bg-gradient-to-b from-primary-dark via-primary-dark to-primary relative overflow-hidden">
            <!-- Background decorative circles -->
            <div class="absolute top-[-100px] right-[-80px] w-72 h-72 rounded-full bg-primary/20 blur-3xl"></div>
            <div class="absolute bottom-[-60px] left-[-60px] w-56 h-56 rounded-full bg-secondary/15 blur-3xl"></div>

            <div class="flex-1 flex flex-col items-center justify-center px-8 relative z-10">
                <!-- Logo -->
                <div class="mb-12">
                    <img src="assets/img/logo.png" alt="LIA" class="h-32 brightness-0 invert mx-auto">
                </div>

                <!-- Login Form -->
                <div class="w-full space-y-4 mb-8">
                    <div class="relative">
                        <i data-lucide="mail"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-300/60"></i>
                        <input type="email" placeholder="E-mail" value="dr.roberto@lia.com"
                            class="w-full bg-white/10 border border-white/20 rounded-xl py-3.5 pl-12 pr-4 text-sm text-white placeholder-blue-200/50 font-medium focus:outline-none focus:ring-2 focus:ring-secondary focus:bg-white/15 transition-all">
                    </div>
                    <div class="relative">
                        <i data-lucide="lock"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-300/60"></i>
                        <input type="password" placeholder="Senha" value="••••••••"
                            class="w-full bg-white/10 border border-white/20 rounded-xl py-3.5 pl-12 pr-4 text-sm text-white placeholder-blue-200/50 font-medium focus:outline-none focus:ring-2 focus:ring-secondary focus:bg-white/15 transition-all">
                    </div>
                </div>

                <button
                    class="w-full bg-white text-primary-dark font-bold py-4 rounded-xl shadow-lg btn-press flex items-center justify-center gap-2 text-base shimmer"
                    onclick="app.navigate('home', null, true)">
                    <i data-lucide="log-in" class="w-5 h-5"></i> Entrar
                </button>

                <p class="text-blue-300/50 text-xs mt-6 text-center">
                    Esqueceu a senha? <span class="text-secondary underline cursor-pointer">Recuperar</span>
                </p>
            </div>

            <!-- Footer -->
            <div class="px-8 pb-8 text-center relative z-10">
                <p class="text-blue-400/30 text-[10px] font-medium tracking-wider uppercase">LIA Platform v1.0 —
                    TecnoAging Lab</p>
            </div>
        </div>
    </template>

    <!-- 1. HOME -->
    <template id="tpl-home">
        <div class="fade-in space-y-5">
            <!-- Professional Profile -->
            <div class="flex items-center gap-3.5 -mx-5 px-5 mb-2">
                <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="user" class="w-6 h-6 text-primary-dark"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium text-[#142B5B] leading-tight">Profissional</p>
                    <p class="text-base font-bold text-primary-dark truncate mt-0.5">João Vitor Mestrado</p>
                </div>
                <button class="w-10 h-10 flex items-center justify-center text-primary-dark transition-colors btn-press"
                    onclick="app.navigate('more', null, true)">
                    <i data-lucide="menu" class="w-7 h-7"></i>
                </button>
            </div>

            <!-- Stats Row -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white rounded-xl p-3 border border-border text-center shadow-sm">
                    <p class="text-2xl font-extrabold text-primary-dark">12</p>
                    <p class="text-[10px] text-text-muted font-medium mt-0.5">Avaliações</p>
                </div>
                <div class="bg-white rounded-xl p-3 border border-border text-center shadow-sm">
                    <p class="text-2xl font-extrabold text-primary-dark">5</p>
                    <p class="text-[10px] text-text-muted font-medium mt-0.5">Participantes</p>
                </div>
                <div class="bg-white rounded-xl p-3 border border-border text-center shadow-sm">
                    <div class="flex items-center justify-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-success"></span>
                        <p class="text-2xl font-extrabold text-success">3</p>
                    </div>
                    <p class="text-[10px] text-text-muted font-medium mt-0.5">Sincronizadas</p>
                </div>
            </div>

            <!-- Start CTA -->
            <div
                class="bg-gradient-to-br from-primary to-primary-dark rounded-2xl p-6 shadow-xl text-white relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 opacity-[0.07]">
                    <i data-lucide="activity" class="w-44 h-44"></i>
                </div>
                <div class="absolute top-0 left-0 right-0 bottom-0 shimmer rounded-2xl"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                        </div>
                        <h2 class="text-lg font-bold">Nova avaliação</h2>
                    </div>
                    <p class="text-sm text-blue-200 mb-5">Inicie uma nova coleta de dados funcionais do participante.
                    </p>
                    <button
                        class="w-full bg-white text-primary-dark font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2 btn-press text-sm"
                        onclick="app.navigate('test-selection')">
                        <i data-lucide="play" class="w-4 h-4"></i> Iniciar avaliação
                    </button>
                </div>
            </div>

            <!-- Analytics Carousel -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider">Visão Geral</h3>
                </div>
                <div class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar gap-4 pb-2">
                    <!-- Card 1: Avaliações por Gênero -->
                    <div
                        class="snap-center shrink-0 w-[85%] bg-white rounded-2xl border border-border shadow-sm p-5 flex flex-col">
                        <h4 class="font-bold text-sm text-text-main mb-5">Avaliações por Gênero</h4>
                        <div class="flex items-center gap-4 justify-between px-2">
                            <div class="relative w-24 h-24 rounded-full flex-shrink-0"
                                style="background: conic-gradient(#00B3B0 0% 56.1%, #142B5B 56.1% 100%);">
                                <div
                                    class="absolute inset-[25%] bg-white rounded-full flex items-center justify-center shadow-inner">
                                    <i data-lucide="users" class="w-5 h-5 text-text-muted"></i>
                                </div>
                            </div>
                            <div class="flex flex-col gap-4">
                                <div class="flex items-center gap-2.5">
                                    <span class="w-3 h-3 rounded-full bg-[#00B3B0]"></span>
                                    <div>
                                        <p class="text-xs font-bold text-text-main leading-tight">Feminino</p>
                                        <p class="text-[10px] text-text-muted leading-tight">2.156 (56,1%)</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2.5">
                                    <span class="w-3 h-3 rounded-full bg-[#142B5B]"></span>
                                    <div>
                                        <p class="text-xs font-bold text-text-main leading-tight">Masculino</p>
                                        <p class="text-[10px] text-text-muted leading-tight">1.689 (43,9%)</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2: Avaliações por Tipo de Teste -->
                    <div
                        class="snap-center shrink-0 w-[85%] bg-white rounded-2xl border border-border shadow-sm p-5 flex flex-col">
                        <h4 class="font-bold text-sm text-text-main mb-5">Avaliações por Tipo de Teste</h4>
                        <div class="flex items-center gap-4 justify-between px-2">
                            <div class="relative w-24 h-24 rounded-full flex-shrink-0"
                                style="background: conic-gradient(#142B5B 0% 62.9%, #00B3B0 62.9% 100%);">
                                <div
                                    class="absolute inset-[25%] bg-white rounded-full flex items-center justify-center shadow-inner">
                                    <i data-lucide="activity" class="w-5 h-5 text-text-muted"></i>
                                </div>
                            </div>
                            <div class="flex flex-col gap-4">
                                <div class="flex items-center gap-2.5">
                                    <span class="w-3 h-3 rounded-full bg-[#142B5B]"></span>
                                    <div>
                                        <p class="text-xs font-bold text-text-main leading-tight">30STS</p>
                                        <p class="text-[10px] text-text-muted leading-tight">2.421 (62,9%)</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2.5">
                                    <span class="w-3 h-3 rounded-full bg-[#00B3B0]"></span>
                                    <div>
                                        <p class="text-xs font-bold text-text-main leading-tight">2MST</p>
                                        <p class="text-[10px] text-text-muted leading-tight">1.424 (37,1%)</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart: Avaliações por Mês -->
            <div class="mt-8 mb-2">
                <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider mb-3">Avaliações por Mês (Últimos
                    90 dias)</h3>

                <div class="bg-white rounded-2xl border border-border shadow-sm p-5">
                    <div class="flex">
                        <!-- Y Axis Labels -->
                        <div class="w-16 flex flex-col space-y-7 text-sm text-text-main text-right pr-3 pt-0.5">
                            <div class="h-5 flex items-center justify-end">Jul/26</div>
                            <div class="h-5 flex items-center justify-end">Ago/26</div>
                            <div class="h-5 flex items-center justify-end">Set/26</div>
                        </div>

                        <!-- Bars Area -->
                        <div class="flex-1 flex flex-col">
                            <div class="border-l border-border pl-0 pb-4 space-y-7">
                                <!-- Jul/26 -->
                                <div class="flex items-center h-5">
                                    <div class="h-5 bg-[#142B5B] transition-all duration-700 rounded-r-sm"
                                        style="width:36%"></div>
                                    <span class="text-sm font-medium text-text-main ml-3">4</span>
                                </div>
                                <!-- Ago/26 -->
                                <div class="flex items-center h-5">
                                    <div class="h-5 bg-[#142B5B] transition-all duration-700 rounded-r-sm"
                                        style="width:0%"></div>
                                    <span class="text-sm font-medium text-text-main ml-3">0</span>
                                </div>
                                <!-- Set/26 -->
                                <div class="flex items-center h-5">
                                    <div class="h-5 bg-[#142B5B] transition-all duration-700 rounded-r-sm"
                                        style="width:36%"></div>
                                    <span class="text-sm font-medium text-text-main ml-3">4</span>
                                </div>
                            </div>

                            <!-- X Axis -->
                            <div class="flex justify-between text-sm text-text-muted ml-[-4px] pr-8">
                                <span>0</span><span>3</span><span>5</span><span>8</span><span>10</span>
                            </div>
                            <p class="text-center text-sm text-text-muted mt-2 ml-[-14px]">Avaliações</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 2. PARTICIPANTS LIST -->
    <template id="tpl-participants">
        <div class="fade-in space-y-4">
            <div class="flex items-center gap-3 mb-1">
                <button
                    class="w-10 h-10 flex items-center justify-center text-text-muted bg-white rounded-xl shadow-sm btn-press border border-border"
                    onclick="app.goBack()">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <h2 class="text-xl font-extrabold text-primary-dark" id="participants-title">Participantes</h2>
            </div>

            <!-- Search -->
            <div class="relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-text-muted"></i>
                <input type="text" placeholder="Buscar por nome ou CPF..."
                    class="w-full bg-white border border-border rounded-xl py-3 pl-11 pr-4 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary shadow-sm transition-all">
            </div>

            <!-- Participant Cards -->
            <div class="space-y-2.5 mt-2">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-border flex items-center gap-4 btn-press cursor-pointer hover:border-primary/30 transition-all"
