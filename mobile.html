<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIA Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#1A365D',
                        'primary-light': '#2A4365',
                        'primary-dark': '#0F172A',
                        secondary: '#2B6CB0',
                        'secondary-light': '#3182CE',
                        accent: '#38B2AC',
                        success: '#38A169',
                        warning: '#D69E2E',
                        danger: '#E53E3E',
                        surface: '#FFFFFF',
                        background: '#F7FAFC',
                        'text-main': '#2D3748',
                        'text-muted': '#718096',
                        border: '#E2E8F0',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            height: 100dvh;
            background-color: #F7FAFC;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .app-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 80px;
        }
        
        .execution-mode .app-content {
            padding-bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: #0F172A; /* Dark mode for execution */
            color: white;
        }
        .execution-mode .bottom-nav, .execution-mode #app-header {
            display: none !important;
        }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .pulse-ring { animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulseRing { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(43, 108, 176, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(43, 108, 176, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(43, 108, 176, 0); } }
    </style>
</head>
<body class="bg-gray-200">

    <div id="app" class="mobile-container text-text-main">
        
        <!-- HEADER -->
        <header id="app-header" class="bg-primary text-white px-5 py-4 shadow-md z-10 flex-shrink-0 flex items-center justify-between transition-all relative">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-accent to-secondary"></div>
            <div id="header-left" class="flex items-center gap-3">
                <img src="assets/img/logo.png" alt="LIA" class="h-6 brightness-0 invert">
            </div>
            <div id="header-right" class="flex items-center">
                <!-- Injected icons like sync -->
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="main-view" class="app-content no-scrollbar p-5">
            <!-- Views injected here -->
        </main>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav" class="bottom-nav absolute bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-between px-2 pb-2 pt-2 h-[72px] z-20">
            <button class="nav-btn flex-1 flex flex-col items-center justify-center text-primary gap-1" data-route="home">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Início</span>
            </button>
            <button class="nav-btn flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 hover:text-primary transition-colors" data-route="history">
                <i data-lucide="clipboard-list" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Avaliações</span>
            </button>
            <button class="nav-btn flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 hover:text-primary transition-colors" data-route="participants">
                <i data-lucide="users" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Participantes</span>
            </button>
            <button class="nav-btn flex-1 flex flex-col items-center justify-center text-gray-400 gap-1 hover:text-primary transition-colors" data-route="more">
                <i data-lucide="menu" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Mais</span>
            </button>
        </nav>
    </div>

    <!-- TEMPLATES -->

    <!-- 1. HOME -->
    <template id="tpl-home">
        <div class="fade-in space-y-6">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-sm text-text-muted">Olá, Dr. Roberto</p>
                    <h1 class="text-2xl font-bold text-primary leading-tight">Vamos avaliar<br>a mobilidade</h1>
                </div>
                <div class="text-right">
                    <div class="inline-flex items-center gap-1 bg-green-50 text-success px-2 py-1 rounded-md text-[10px] font-bold border border-green-100">
                        <i data-lucide="check-circle" class="w-3 h-3"></i> Sensores OK
                    </div>
                </div>
            </div>

            <!-- Start CTA -->
            <div class="bg-gradient-to-br from-primary to-secondary rounded-2xl p-6 shadow-lg text-white relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 opacity-10">
                    <i data-lucide="activity" class="w-40 h-40"></i>
                </div>
                <div class="relative z-10">
                    <h2 class="text-xl font-bold mb-2">Nova avaliação</h2>
                    <p class="text-sm text-blue-100 mb-6">Inicie uma nova coleta de dados funcionais.</p>
                    <button class="w-full bg-white text-primary font-bold py-4 rounded-xl shadow-md flex items-center justify-center gap-2 active:scale-95 transition-transform" onclick="app.navigate('participants', {selectMode: true})">
                        <i data-lucide="play" class="w-5 h-5"></i> Iniciar avaliação
                    </button>
                </div>
            </div>

            <!-- Recent -->
            <div>
                <h3 class="text-xs font-bold text-gray-500 mb-3 uppercase tracking-wider">Últimas Avaliações</h3>
                <div class="space-y-3">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 active:bg-gray-50 transition-colors" onclick="app.navigate('history')">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-secondary flex items-center justify-center font-bold text-sm">30s</div>
                        <div class="flex-1">
                            <p class="font-bold text-sm text-text-main">Manuela Silva</p>
                            <p class="text-xs text-text-muted">30sSTS • Hoje, 09:15</p>
                        </div>
                        <div class="text-success"><i data-lucide="cloud-check" class="w-5 h-5"></i></div>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 active:bg-gray-50 transition-colors" onclick="app.navigate('history')">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-secondary flex items-center justify-center font-bold text-sm">TUG</div>
                        <div class="flex-1">
                            <p class="font-bold text-sm text-text-main">João Oliveira</p>
                            <p class="text-xs text-text-muted">TUG • Ontem, 14:30</p>
                        </div>
                        <div class="text-success"><i data-lucide="cloud-check" class="w-5 h-5"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- 2. PARTICIPANTS LIST -->
    <template id="tpl-participants">
        <div class="fade-in space-y-4">
            <div class="flex items-center gap-3 mb-2">
                <button class="w-10 h-10 flex items-center justify-center text-text-muted bg-white rounded-full shadow-sm active:bg-gray-100" onclick="app.goBack()">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <h2 class="text-xl font-bold text-primary" id="participants-title">Participantes</h2>
            </div>

            <!-- Search -->
            <div class="relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                <input type="text" placeholder="Buscar por nome ou código..." class="w-full bg-white border border-gray-200 rounded-full py-3.5 pl-12 pr-4 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-secondary shadow-sm">
            </div>

            <!-- List -->
            <div class="space-y-3 mt-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 active:bg-blue-50 transition-colors cursor-pointer" onclick="app.selectParticipant('Manuela Silva', 68)">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-secondary text-white flex items-center justify-center font-bold text-lg">MS</div>
                    <div class="flex-1">
                        <p class="font-bold text-base text-text-main">Manuela Silva</p>
                        <p class="text-sm text-text-muted">68 anos • Cód: 0992</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 active:bg-blue-50 transition-colors cursor-pointer" onclick="app.selectParticipant('João Oliveira', 72)">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-secondary text-white flex items-center justify-center font-bold text-lg">JO</div>
                    <div class="flex-1">
                        <p class="font-bold text-base text-text-main">João Oliveira</p>
                        <p class="text-sm text-text-muted">72 anos • Cód: 1024</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
                </div>
            </div>

            <button class="w-full bg-blue-50 text-secondary font-bold py-4 rounded-xl mt-4 flex items-center justify-center gap-2 active:bg-blue-100 transition-colors">
                <i data-lucide="user-plus" class="w-5 h-5"></i> Adicionar Participante
            </button>
        </div>
    </template>

    <!-- 3. PARTICIPANT SUMMARY -->
    <template id="tpl-participant-summary">
        <div class="fade-in flex flex-col h-full">
            <div class="flex items-center gap-3 mb-6">
                <button class="w-10 h-10 flex items-center justify-center text-text-muted bg-white rounded-full shadow-sm active:bg-gray-100" onclick="app.goBack()">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <h2 class="text-xl font-bold text-primary">Resumo</h2>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col items-center mb-6">
                <div class="w-20 h-20 rounded-full bg-gradient-to-br from-primary to-secondary text-white flex items-center justify-center font-bold text-3xl mb-4 shadow-md" id="ps-initials">MS</div>
                <h3 class="text-2xl font-bold text-text-main mb-1" id="ps-name">Manuela Silva</h3>
                <p class="text-text-muted text-base mb-4"><span id="ps-age">68</span> anos</p>
                
                <div class="w-full border-t border-gray-100 pt-4 flex justify-between items-center text-sm">
                    <span class="text-text-muted font-medium">Última avaliação:</span>
                    <span class="font-bold text-primary">12/08/2025</span>
                </div>
            </div>

            <div class="mt-auto pt-4">
                <button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-md active:bg-primary-light transition-colors text-lg" onclick="app.navigate('test-selection')">
                    Continuar
                </button>
            </div>
        </div>
    </template>

    <!-- 4. TEST SELECTION -->
    <template id="tpl-test-selection">
        <div class="fade-in pb-4">
            <div class="flex items-center gap-3 mb-6">
                <button class="w-10 h-10 flex items-center justify-center text-text-muted bg-white rounded-full shadow-sm active:bg-gray-100" onclick="app.goBack()">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <h2 class="text-xl font-bold text-primary">Escolha o teste</h2>
            </div>

            <div class="space-y-4">
                <!-- 30sSTS -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 active:border-secondary active:ring-2 active:ring-secondary/20 transition-all cursor-pointer" onclick="app.selectTest('30sSTS', '30-Second Sit-to-Stand')">
                    <div class="flex justify-between items-start mb-2">
                        <div class="bg-blue-50 text-secondary w-12 h-12 rounded-xl flex items-center justify-center mb-3">
                            <i data-lucide="arrow-up-down" class="w-6 h-6"></i>
                        </div>
                        <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-1 rounded">30s</span>
                    </div>
                    <h3 class="text-lg font-bold text-primary">30sSTS</h3>
                    <p class="text-sm text-text-muted">30-Second Sit-to-Stand</p>
                </div>

                <!-- 5TSTS -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 active:border-secondary active:ring-2 active:ring-secondary/20 transition-all cursor-pointer" onclick="app.selectTest('5TSTS', 'Five Times Sit-to-Stand')">
                    <div class="flex justify-between items-start mb-2">
                        <div class="bg-blue-50 text-secondary w-12 h-12 rounded-xl flex items-center justify-center mb-3">
                            <i data-lucide="activity-square" class="w-6 h-6"></i>
                        </div>
                        <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-1 rounded">~15s</span>
                    </div>
                    <h3 class="text-lg font-bold text-primary">5TSTS</h3>
                    <p class="text-sm text-text-muted">Five Times Sit-to-Stand</p>
                </div>

                <!-- TUG -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 active:border-secondary active:ring-2 active:ring-secondary/20 transition-all cursor-pointer" onclick="app.selectTest('TUG', 'Timed Up and Go')">
                    <div class="flex justify-between items-start mb-2">
                        <div class="bg-blue-50 text-secondary w-12 h-12 rounded-xl flex items-center justify-center mb-3">
                            <i data-lucide="footprints" class="w-6 h-6"></i>
                        </div>
                        <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-1 rounded">~10s</span>
                    </div>
                    <h3 class="text-lg font-bold text-primary">TUG</h3>
                    <p class="text-sm text-text-muted">Timed Up and Go</p>
                </div>
            </div>
        </div>
    </template>

    <!-- 5. TEST INSTRUCTIONS -->
    <template id="tpl-test-instructions">
        <div class="fade-in flex flex-col h-full">
            <div class="flex items-center gap-3 mb-4">
                <button class="w-10 h-10 flex items-center justify-center text-text-muted bg-white rounded-full shadow-sm active:bg-gray-100" onclick="app.goBack()">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="flex-1">
                    <h2 class="text-xl font-bold text-primary leading-tight" id="ti-title">30sSTS</h2>
                    <p class="text-xs text-text-muted" id="ti-subtitle">30-Second Sit-to-Stand</p>
                </div>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6">
                <p class="text-sm text-secondary-light font-medium"><strong class="text-secondary">Objetivo:</strong> Realizar o maior número possível de repetições durante o tempo estipulado.</p>
            </div>

            <div class="flex-1 overflow-y-auto">
                <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Instruções</h3>
                <ul class="space-y-4 relative before:absolute before:inset-y-0 before:left-3.5 before:w-0.5 before:bg-gray-200 ml-1">
                    <li class="relative pl-10">
                        <div class="absolute left-0 top-0.5 w-7 h-7 rounded-full bg-white border-2 border-primary text-primary font-bold text-xs flex items-center justify-center z-10 shadow-sm">1</div>
                        <p class="text-sm font-medium text-text-main leading-relaxed">Sente-se na cadeira com as costas retas.</p>
                    </li>
                    <li class="relative pl-10">
                        <div class="absolute left-0 top-0.5 w-7 h-7 rounded-full bg-white border-2 border-primary text-primary font-bold text-xs flex items-center justify-center z-10 shadow-sm">2</div>
                        <p class="text-sm font-medium text-text-main leading-relaxed">Posicione o smartphone no tórax verticalmente.</p>
                    </li>
                    <li class="relative pl-10">
                        <div class="absolute left-0 top-0.5 w-7 h-7 rounded-full bg-white border-2 border-primary text-primary font-bold text-xs flex items-center justify-center z-10 shadow-sm">3</div>
                        <p class="text-sm font-medium text-text-main leading-relaxed">Ao ouvir o sinal, levante-se e sente-se repetidamente.</p>
                    </li>
                </ul>
            </div>

            <div class="mt-6 space-y-3 pt-4 border-t border-gray-200 bg-background">
                <button class="w-full bg-white text-primary border-2 border-primary font-bold py-3.5 rounded-xl active:bg-gray-50 transition-colors flex items-center justify-center gap-2" onclick="app.navigate('test-position')">
                    <i data-lucide="smartphone" class="w-5 h-5"></i> Ver posicionamento
                </button>
                <button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-md active:bg-primary-light transition-colors text-lg" onclick="app.navigate('sensor-check')">
                    Começar avaliação
                </button>
            </div>
        </div>
    </template>

    <!-- 6. SMARTPHONE POSITIONING -->
    <template id="tpl-test-position">
        <div class="fade-in flex flex-col h-full">
            <div class="flex items-center justify-center relative mb-8">
                <button class="absolute left-0 w-10 h-10 flex items-center justify-center text-text-muted bg-white rounded-full shadow-sm active:bg-gray-100" onclick="app.goBack()">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <h2 class="text-lg font-bold text-primary">Posicionamento</h2>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center px-4">
                
                <!-- Scientific Minimalist Visual -->
                <div class="relative w-48 h-64 border-4 border-dashed border-gray-300 rounded-3xl mb-8 flex items-center justify-center bg-white shadow-inner">
                    <!-- Thorax outline -->
                    <div class="absolute inset-0 opacity-20 flex justify-center items-center">
                        <i data-lucide="user" class="w-40 h-40"></i>
                    </div>
                    <!-- Smartphone -->
                    <div class="relative w-20 h-40 bg-primary rounded-2xl shadow-xl border-4 border-gray-800 flex items-center justify-center z-10">
                        <div class="absolute top-2 w-6 h-1 bg-gray-600 rounded-full"></div>
                        <i data-lucide="smartphone" class="text-white opacity-50 w-8 h-8"></i>
                        <div class="absolute bottom-2 w-10 h-1 bg-white opacity-20 rounded-full"></div>
                    </div>
                </div>

                <h3 class="text-xl font-bold text-text-main text-center mb-3">Posicione no tórax</h3>
                <p class="text-center text-text-muted text-sm px-4">
                    Posicione o smartphone <strong class="text-primary">verticalmente</strong> sobre o tórax do participante. 
                    <br><br>
                    Evite movimentar o dispositivo com as mãos durante a avaliação.
                </p>
            </div>

            <div class="mt-auto pt-6">
                <button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-md active:bg-primary-light transition-colors text-lg" onclick="app.goBack()">
                    Confirmar posicionamento
                </button>
            </div>
        </div>
    </template>

    <!-- 7. SENSOR CHECK -->
    <template id="tpl-sensor-check">
        <div class="fade-in flex flex-col h-full justify-center items-center text-center">
            <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mb-6 relative pulse-ring">
                <i data-lucide="cpu" class="w-10 h-10 text-secondary"></i>
            </div>
            
            <h2 class="text-2xl font-bold text-primary mb-2">Verificação do Dispositivo</h2>
            <p class="text-sm text-text-muted mb-8">Validando sensores para aquisição...</p>

            <div class="w-full bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-left space-y-4 mb-8">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-text-main flex items-center gap-2">
                        <i data-lucide="move" class="w-4 h-4 text-gray-400"></i> Acelerômetro
                    </span>
                    <i data-lucide="check" class="w-5 h-5 text-success"></i>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-text-main flex items-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-4 h-4 text-gray-400"></i> Giroscópio
                    </span>
                    <i data-lucide="check" class="w-5 h-5 text-success"></i>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-text-main flex items-center gap-2">
                        <i data-lucide="compass" class="w-4 h-4 text-gray-400"></i> Orientação
                    </span>
                    <i data-lucide="check" class="w-5 h-5 text-success"></i>
                </div>
                <div class="pt-3 border-t border-gray-100 flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-500 uppercase">Taxa de aquisição</span>
                    <span class="text-sm font-bold text-secondary bg-blue-50 px-2 py-1 rounded">60 Hz</span>
                </div>
            </div>

            <div class="bg-green-50 text-success px-4 py-3 rounded-xl border border-green-100 w-full mb-8 font-medium text-sm flex items-center justify-center gap-2">
                <i data-lucide="check-circle-2" class="w-5 h-5"></i> Sensores preparados
            </div>

            <button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-md active:bg-primary-light transition-colors text-lg" onclick="app.navigate('countdown')">
                Iniciar
            </button>
        </div>
    </template>

    <!-- 8. COUNTDOWN -->
    <template id="tpl-countdown">
        <div class="fade-in flex flex-col h-full items-center justify-center bg-primary-dark fixed inset-0 z-50 text-white">
            <h2 class="text-2xl font-bold text-blue-200 mb-10 tracking-widest uppercase">Prepare-se</h2>
            <div id="countdown-number" class="text-9xl font-extrabold tabular-nums">3</div>
        </div>
    </template>

    <!-- 9. EXECUTION -->
    <template id="tpl-test-execution">
        <div class="fade-in flex flex-col h-full items-center">
            
            <div class="w-full flex justify-between items-center mb-8 px-4 pt-4">
                <span class="bg-gray-800 text-gray-300 text-xs font-bold px-3 py-1.5 rounded-full" id="exec-test-name">30sSTS</span>
                <span class="flex items-center gap-2 text-success font-bold text-sm bg-green-900/30 px-3 py-1.5 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-success animate-pulse"></span> Em execução
                </span>
            </div>

            <div class="flex-1 w-full flex flex-col items-center justify-center">
                
                <p class="text-gray-400 text-sm font-bold uppercase tracking-widest mb-2" id="exec-timer-label">Tempo restante</p>
                <div class="text-7xl font-extrabold text-white tabular-nums tracking-tighter mb-12 drop-shadow-lg" id="exec-timer">
                    30<span class="text-3xl text-gray-400 ml-1">s</span>
                </div>

                <div class="bg-gray-800/50 border border-gray-700 w-full max-w-xs rounded-3xl p-6 flex flex-col items-center shadow-xl backdrop-blur-sm">
                    <p class="text-gray-400 text-sm font-bold uppercase tracking-widest mb-1" id="exec-reps-label">Repetições</p>
                    <div class="text-6xl font-black text-accent tabular-nums" id="exec-reps">00</div>
                    
                    <div class="mt-6 w-full pt-4 border-t border-gray-700 flex justify-center">
                        <div class="flex items-center gap-2 text-gray-300 text-sm font-medium">
                            <i data-lucide="activity" class="w-4 h-4 text-secondary-light"></i>
                            <span id="exec-status-text">Aguardando...</span>
                        </div>
                    </div>
                </div>

            </div>

            <div class="w-full p-6 flex gap-4 mt-auto">
                <button id="btn-exec-pause" class="flex-1 bg-gray-800 text-white font-bold py-4 rounded-xl border border-gray-700 active:bg-gray-700 transition-colors" onclick="mobileTests.togglePause()">
                    Pausar
                </button>
                <button class="flex-1 bg-red-900/40 text-red-400 font-bold py-4 rounded-xl border border-red-900/50 active:bg-red-900/60 transition-colors" onclick="mobileTests.cancel()">
                    Cancelar
                </button>
            </div>
        </div>
    </template>

    <!-- 10. SUMMARY -->
    <template id="tpl-test-summary">
        <div class="fade-in flex flex-col h-full">
            
            <div class="text-center mb-8 mt-4">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-success mb-4">
                    <i data-lucide="check" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-primary">Avaliação concluída</h2>
                <p class="text-text-muted mt-1">Coleta finalizada com sucesso</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                <div class="bg-gray-50 px-5 py-3 border-b border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Resumo da Coleta</h3>
                </div>
                <div class="p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-text-muted text-sm font-medium">Participante</span>
                        <span class="font-bold text-text-main" id="sum-name">Manuela Silva</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-text-muted text-sm font-medium">Teste</span>
                        <span class="font-bold text-text-main" id="sum-test">30sSTS</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-text-muted text-sm font-medium" id="sum-time-label">Duração</span>
                        <span class="font-bold text-text-main" id="sum-time">30 s</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-text-muted text-sm font-medium" id="sum-reps-label">Repetições</span>
                        <span class="font-bold text-accent text-xl" id="sum-reps">12</span>
                    </div>
                    <div class="pt-3 border-t border-gray-100 flex justify-between items-center">
                        <span class="text-text-muted text-xs font-medium">Sensor</span>
                        <span class="text-xs font-bold text-gray-500">Acel + Giro (60Hz)</span>
                    </div>
                </div>
            </div>

            <p class="text-center text-xs text-gray-400 px-4 font-medium mb-auto">
                Os dados brutos serão processados e analisados posteriormente na plataforma LIA Web.
            </p>

            <div class="mt-6 flex gap-3 pt-4 border-t border-gray-200">
                <button class="w-1/3 bg-white text-primary border border-gray-300 font-bold py-4 rounded-xl active:bg-gray-50 transition-colors">
                    Revisar
                </button>
                <button class="flex-1 bg-primary text-white font-bold py-4 rounded-xl shadow-md active:bg-primary-light transition-colors text-lg flex justify-center items-center gap-2" onclick="app.navigate('sync')">
                    <i data-lucide="save" class="w-5 h-5"></i> Salvar
                </button>
            </div>
        </div>
    </template>

    <!-- 11. SYNC -->
    <template id="tpl-sync">
        <div class="fade-in flex flex-col h-full justify-center items-center text-center px-4">
            
            <!-- Syncing Animation -->
            <div id="sync-animation" class="relative w-24 h-24 mb-8">
                <svg class="animate-spin w-full h-full text-blue-100" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75 text-secondary" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <i data-lucide="cloud-upload" class="absolute inset-0 m-auto w-8 h-8 text-primary"></i>
            </div>

            <div id="sync-success-icon" class="hidden w-24 h-24 bg-green-100 text-success rounded-full flex items-center justify-center mb-8">
                <i data-lucide="check" class="w-12 h-12"></i>
            </div>

            <h2 class="text-2xl font-bold text-primary mb-2" id="sync-title">Sincronizando avaliação</h2>
            <p class="text-sm text-text-muted mb-8" id="sync-desc">Aguarde enquanto os dados são enviados...</p>

            <div class="w-full max-w-xs space-y-4 text-left" id="sync-steps">
                <div class="flex items-center gap-3 text-success font-medium text-sm">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i> Dados coletados
                </div>
                <div class="flex items-center gap-3 text-success font-medium text-sm">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i> Arquivos organizados
                </div>
                <div class="flex items-center gap-3 text-primary font-bold text-sm" id="sync-step-3">
                    <span class="relative flex h-3 w-3 ml-1 mr-1">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-secondary"></span>
                    </span>
                    Sincronizando na nuvem...
                </div>
            </div>

            <button id="sync-finish-btn" class="hidden w-full bg-primary text-white font-bold py-4 rounded-xl shadow-md active:bg-primary-light transition-colors mt-12" onclick="app.navigate('home')">
                Voltar ao Início
            </button>
        </div>
    </template>

    <!-- 12. HISTORY -->
    <template id="tpl-history">
        <div class="fade-in space-y-4">
            <h2 class="text-xl font-bold text-primary mb-4">Avaliações Salvas</h2>

            <div class="space-y-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-blue-50 text-secondary flex items-center justify-center font-bold text-sm">30s</div>
                    <div class="flex-1">
                        <p class="font-bold text-base text-text-main">Manuela Silva</p>
                        <div class="flex gap-2 text-xs text-text-muted font-medium mt-1">
                            <span class="bg-gray-100 px-2 py-0.5 rounded">12/08</span>
                            <span>12 reps</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <i data-lucide="cloud-check" class="w-5 h-5 text-success"></i>
                        <span class="text-[9px] font-bold text-success uppercase">Sync</span>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-blue-50 text-secondary flex items-center justify-center font-bold text-sm">TUG</div>
                    <div class="flex-1">
                        <p class="font-bold text-base text-text-main">João Oliveira</p>
                        <div class="flex gap-2 text-xs text-text-muted font-medium mt-1">
                            <span class="bg-gray-100 px-2 py-0.5 rounded">10/08</span>
                            <span>13.2s</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <i data-lucide="cloud-check" class="w-5 h-5 text-success"></i>
                        <span class="text-[9px] font-bold text-success uppercase">Sync</span>
                    </div>
                </div>
                
                <div class="bg-white p-4 rounded-xl shadow-sm border border-yellow-100 flex items-center gap-4 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-warning"></div>
                    <div class="w-12 h-12 rounded-full bg-yellow-50 text-warning flex items-center justify-center font-bold text-sm">5TSTS</div>
                    <div class="flex-1">
                        <p class="font-bold text-base text-text-main">Maria Santos</p>
                        <div class="flex gap-2 text-xs text-text-muted font-medium mt-1">
                            <span class="bg-gray-100 px-2 py-0.5 rounded">05/08</span>
                            <span>14.5s</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <i data-lucide="cloud-off" class="w-5 h-5 text-warning"></i>
                        <span class="text-[9px] font-bold text-warning uppercase">Offline</span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="assets/js/mobile-app.js"></script>
    <script src="assets/js/mobile-tests.js"></script>
</body>
</html>
